name: Build all

on:
  push:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'cmake/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'localization/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"
     - ".github/workflows/unit_tests*.yml"
     - 'build_linux.sh'
     - 'build_win.bat'
     - 'scripts/test_build_win.ps1'
     - 'scripts/check_exception_throw_info.ps1'
     - 'scripts/test_check_exception_throw_info.ps1'
     - 'build_release_macos.sh'
     - 'scripts/build_preset_cache.*'
     - 'scripts/prune_cached_presets.ps1'
     - 'scripts/test_prune_cached_presets.ps1'
     - 'scripts/flatpak/**'
     - 'scripts/msix/**'
     - 'scripts/sign_windows.ps1'
     - 'tests/**'

  pull_request:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'cmake/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - ".github/workflows/unit_tests*.yml"
     - 'build_linux.sh'
     - 'build_win.bat'
     - 'scripts/test_build_win.ps1'
     - 'scripts/check_exception_throw_info.ps1'
     - 'scripts/test_check_exception_throw_info.ps1'
     - 'build_release_macos.sh'
     - 'scripts/build_preset_cache.*'
     - 'scripts/prune_cached_presets.ps1'
     - 'scripts/test_prune_cached_presets.ps1'
     - 'scripts/flatpak/**'
     - 'scripts/msix/**'
     - 'scripts/sign_windows.ps1'
     - 'tests/**'


  schedule:
      - cron: '15 2 * * *' # 10:15 AM Singapore time (UTC+8), when macOS runners are least busy

  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

concurrency:
  # cancel_closed_pr_builds.yml joins this group by name, so update that file
  # with any change here.
  group: build-all-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Pushes don't cancel a running build, because only a finished branch build
  # saves caches every pull request can restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  

jobs:
  check_build_script:
    name: Windows build script tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      # Windows PowerShell rather than pwsh: the suite drives build_win.bat
      # through cmd, and the two differ in how they quote native arguments.
      - name: Run the build script test suite
        shell: powershell
        run: .\scripts\test_build_win.ps1

      - name: Run the exception throw info check tests
        shell: powershell
        run: .\scripts\test_check_exception_throw_info.ps1

      - name: Run the preset prune tests
        shell: powershell
        run: .\scripts\test_prune_cached_presets.ps1

  build_windows:
    name: Build Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            compiler: clang
    needs: check_build_script
    # id-token lets release builds sign through Google Cloud Workload Identity Federation (see
    # "Configure code signing" in build_orca.yml); the rest is what the build already used.
    permissions:
      actions: write
      contents: write
      id-token: write
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && needs.check_build_script.result == 'success' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      compiler: ${{ matrix.compiler }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
